<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Flick</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root {
  --void: #000000;
  --ash: #141416;
  --line: #2a2a2e;
  --fog: #8d8d96;
  --bone: #f4f3ef;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  height: 100%;
  background: var(--void);
  color: var(--bone);
  font-family: system-ui, "Segoe UI", Roboto, sans-serif;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
body {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
}
button { font-family: inherit; cursor: pointer; }
button:active { transform: scale(0.96); }

.glow {
  position: fixed;
  inset: -12%;
  background-size: cover;
  background-position: center;
  filter: blur(46px) saturate(1.6);
  opacity: 0;
  transition: opacity 0.7s;
  z-index: 0;
}
.glow.on { opacity: 0.55; }

header, nav, main, footer { position: relative; z-index: 1; }

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px 2px;
}
h1 {
  margin: 0;
  font-family: Syne, system-ui, sans-serif;
  font-weight: 800;
  font-size: 28px;
  letter-spacing: -0.03em;
}
#saves {
  background: none;
  border: 0;
  color: var(--bone);
  font-size: 15px;
  font-weight: 600;
  padding: 8px 0 8px 12px;
}
#count { color: var(--fog); margin-left: 4px; }

nav {
  display: flex;
  gap: 22px;
  overflow-x: auto;
  padding: 8px 20px 10px;
  scrollbar-width: none;
}
nav::-webkit-scrollbar { display: none; }
.chip {
  flex: none;
  background: none;
  border: 0;
  border-bottom: 2px solid transparent;
  color: var(--fog);
  font-size: 15px;
  font-weight: 600;
  padding: 6px 0;
}
.chip.on { color: var(--bone); border-bottom-color: var(--bone); }

main {
  flex: 1;
  min-height: 0;
  margin: 6px 20px 16px;
}
.card {
  position: absolute;
  inset: 0;
  border-radius: 28px;
  overflow: hidden;
  background: var(--ash);
  touch-action: none;
  will-change: transform;
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
}
.card img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  pointer-events: none;
  -webkit-user-drag: none;
}
.stamp {
  position: absolute;
  top: 26px;
  padding: 2px 14px 6px;
  border: 3px solid;
  border-radius: 12px;
  font-family: Syne, system-ui, sans-serif;
  font-weight: 800;
  font-size: 34px;
  background: rgba(0, 0, 0, 0.4);
  opacity: 0;
  pointer-events: none;
}
.stamp.keep { left: 22px; transform: rotate(-14deg); color: var(--bone); border-color: var(--bone); }
.stamp.skip { right: 22px; transform: rotate(14deg); color: var(--fog); border-color: var(--fog); }

.message {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding: 0 30px;
  text-align: center;
  color: var(--fog);
  font-size: 17px;
  line-height: 1.4;
}
.message p { margin: 0; }
.message button {
  background: var(--bone);
  color: #000;
  border: 0;
  border-radius: 24px;
  padding: 13px 26px;
  font-size: 16px;
  font-weight: 700;
}

footer {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 20px 18px;
}
.round {
  flex: none;
  width: 58px;
  height: 58px;
  border-radius: 50%;
  border: 1.5px solid rgba(255, 255, 255, 0.3);
  background: rgba(20, 20, 22, 0.65);
  color: var(--bone);
  display: grid;
  place-items: center;
}
.round svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
#wallpaper {
  flex: 1;
  height: 58px;
  border: 0;
  border-radius: 29px;
  background: var(--bone);
  color: #000;
  font-size: 17px;
  font-weight: 700;
}

.overlay {
  position: fixed;
  inset: 0;
  z-index: 5;
  background: var(--void);
  display: none;
  flex-direction: column;
}
.overlay.open { display: flex; }
#detail { z-index: 6; }
.bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px 10px;
}
.bar h2 {
  margin: 0;
  font-family: Syne, system-ui, sans-serif;
  font-weight: 800;
  font-size: 24px;
  letter-spacing: -0.02em;
}
.plain {
  background: none;
  border: 0;
  color: var(--bone);
  font-size: 16px;
  font-weight: 600;
  padding: 8px 0 8px 12px;
}
#grid {
  flex: 1;
  overflow-y: auto;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  align-content: start;
  gap: 6px;
  padding: 4px 6px 20px;
}
.tile {
  width: 100%;
  aspect-ratio: 9 / 16;
  object-fit: cover;
  border-radius: 10px;
  background: var(--ash);
}
#empty {
  grid-column: 1 / -1;
  padding: 80px 30px;
  text-align: center;
  color: var(--fog);
  font-size: 17px;
  line-height: 1.4;
}
#photo {
  flex: 1;
  min-height: 0;
  margin: 4px 20px 16px;
  border-radius: 28px;
  object-fit: cover;
  background: var(--ash);
  width: calc(100% - 40px);
}
#actions {
  display: flex;
  gap: 14px;
  padding: 0 20px 18px;
}
#trash {
  flex: none;
  height: 58px;
  padding: 0 24px;
  border-radius: 29px;
  border: 1.5px solid rgba(255, 255, 255, 0.3);
  background: none;
  color: var(--bone);
  font-size: 16px;
  font-weight: 600;
}
#assign {
  flex: 1;
  height: 58px;
  border: 0;
  border-radius: 29px;
  background: var(--bone);
  color: #000;
  font-size: 17px;
  font-weight: 700;
}

#cover {
  position: fixed;
  inset: 0;
  z-index: 8;
  background: rgba(0, 0, 0, 0.65);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}
#cover.open { opacity: 1; pointer-events: auto; }
#sheet {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 9;
  background: var(--ash);
  border-radius: 26px 26px 0 0;
  padding: 22px 20px 12px;
  transform: translateY(105%);
  transition: transform 0.28s;
}
#sheet.open { transform: none; }
#sheet h3 {
  margin: 0 0 12px;
  font-family: Syne, system-ui, sans-serif;
  font-weight: 800;
  font-size: 22px;
}
.option {
  display: block;
  width: 100%;
  text-align: left;
  background: none;
  border: 0;
  border-top: 1px solid var(--line);
  color: var(--bone);
  font-size: 17px;
  font-weight: 600;
  padding: 19px 0;
}
.option.quiet { color: var(--fog); }

#toast {
  position: fixed;
  left: 50%;
  bottom: 104px;
  z-index: 12;
  transform: translate(-50%, 16px);
  background: var(--bone);
  color: #000;
  padding: 12px 20px;
  border-radius: 24px;
  font-size: 15px;
  font-weight: 600;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  * { transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>

<div id="glow0" class="glow"></div>
<div id="glow1" class="glow"></div>

<header>
  <h1>flick</h1>
  <button id="saves">Saved<span id="count">0</span></button>
</header>

<nav id="chips"></nav>

<main id="cards"></main>

<footer>
  <button id="nope" class="round" aria-label="Skip wallpaper">
    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <button id="wallpaper">Set wallpaper</button>
  <button id="like" class="round" aria-label="Save wallpaper">
    <svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"/></svg>
  </button>
</footer>

<section id="panel" class="overlay">
  <div class="bar">
    <h2>Saved</h2>
    <button id="finish" class="plain">Done</button>
  </div>
  <div id="grid"></div>
</section>

<section id="detail" class="overlay">
  <div class="bar">
    <button id="back" class="plain" style="padding-left:0">Back</button>
  </div>
  <img id="photo" alt="">
  <div id="actions">
    <button id="trash">Remove</button>
    <button id="assign">Set wallpaper</button>
  </div>
</section>

<div id="cover"></div>
<div id="sheet">
  <h3>Set as wallpaper</h3>
  <button class="option" data-mode="1">Home screen</button>
  <button class="option" data-mode="2">Lock screen</button>
  <button class="option" data-mode="3">Home and lock screen</button>
  <button id="cancel" class="option quiet">Cancel</button>
</div>

<div id="toast"></div>

<script>
var base = "https://www.ignitewallpaper.com/";
var media = "https://static.wixstatic.com/media/";

var cats = [
  { slug: "home", name: "Featured" },
  { slug: "amoled", name: "AMOLED" },
  { slug: "anime-world", name: "Anime" },
  { slug: "gaming-arena", name: "Gaming" },
  { slug: "marvel-universe", name: "Marvel" },
  { slug: "dc-universe", name: "DC" },
  { slug: "legendary-heroes", name: "Heroes" },
  { slug: "minimal-vibes", name: "Minimal" },
  { slug: "velocity-garage", name: "Cars" },
  { slug: "artistic-illustration", name: "Art" },
  { slug: "creator-s-collection", name: "Creators" },
  { slug: "divine-collection", name: "Divine" },
  { slug: "tool-kingdom", name: "Tech" },
  { slug: "iphone-vault", name: "iPhone" },
  { slug: "samsung-hub", name: "Samsung" }
];

var pool = [];
var place = 0;
var session = 0;
var queue = [];
var saved = [];
var seen = {};
var target = "";
var layers = [];
var active = "all";
var loading = false;
var problems = 0;
var dragging = false;
var flying = false;
var side = 0;
var flight = 0;
var lit = 0;
var timer = 0;
var hider = 0;
var pushed = true;
var anchor = { x: 0, y: 0 };
var shift = { x: 0, y: 0 };

var stack = pick("cards");

function pick(id) {
  return document.getElementById(id);
}

function notice(text, sticky) {
  var box = pick("toast");
  box.textContent = text;
  box.className = "show";
  clearTimeout(hider);
  if (!sticky) {
    hider = setTimeout(hide, 2200);
  }
}

function hide() {
  pick("toast").className = "";
}

function load(name) {
  var raw = "";
  try {
    if (window.Native) {
      raw = Native.read(name);
    } else {
      raw = localStorage.getItem(name);
    }
  } catch (problem) {
    raw = "";
  }
  if (!raw) {
    return null;
  }
  try {
    return JSON.parse(raw);
  } catch (problem) {
    return null;
  }
}

function store(name, value) {
  var raw = JSON.stringify(value);
  try {
    if (window.Native) {
      Native.write(name, raw);
    } else {
      localStorage.setItem(name, raw);
    }
  } catch (problem) {
    return;
  }
}

function original(id) {
  return media + id;
}

function preview(id) {
  return media + id + "/v1/fit/w_800,h_1600,q_85/wallpaper.jpg";
}

function small(id) {
  return media + id + "/v1/fit/w_240,h_430,q_70/wallpaper.jpg";
}

function valid(letter) {
  if (letter === "") {
    return false;
  }
  return "abcdefghijklmnopqrstuvwxyz0123456789".indexOf(letter.toLowerCase()) !== -1;
}

function harvest(html) {
  var clean = html.split("%7E").join("~").split("%7e").join("~");
  var stops = "\"' )<>\\\n";
  var walls = stops + "/:=,;{}[]";
  var marker = "static.wixstatic.com/media/";
  var good = [];
  var bad = {};
  var from = 0;

  while (true) {
    var spot = clean.indexOf(marker, from);
    if (spot === -1) {
      break;
    }
    var start = spot + marker.length;
    var end = start;
    while (end < clean.length && stops.indexOf(clean.charAt(end)) === -1) {
      end = end + 1;
    }
    from = end;
    var parts = clean.substring(start, end).split("/");
    var id = parts[0];
    if (id.indexOf("~mv2.") === -1) {
      continue;
    }
    if (bad[id] || good.indexOf(id) !== -1) {
      continue;
    }
    if (parts.length < 4 || parts[1] !== "v1") {
      continue;
    }
    var params = parts[3].split(",");
    var width = 0;
    var height = 0;
    for (var index = 0; index < params.length; index++) {
      var one = params[index];
      if (one.indexOf("w_") === 0) {
        width = parseInt(one.substring(2), 10);
      }
      if (one.indexOf("h_") === 0) {
        height = parseInt(one.substring(2), 10);
      }
    }
    if (width < 100 || height < 100) {
      continue;
    }
    if (height < width * 0.9 || height > width * 3) {
      bad[id] = 1;
      continue;
    }
    good.push(id);
  }

  var tail = "~mv2.";
  var extra = [];
  from = 0;
  while (true) {
    var hit = clean.indexOf(tail, from);
    if (hit === -1) {
      break;
    }
    from = hit + tail.length;
    var first = hit;
    while (first > 0 && walls.indexOf(clean.charAt(first - 1)) === -1) {
      first = first - 1;
    }
    var last = hit + tail.length;
    while (last < clean.length && valid(clean.charAt(last))) {
      last = last + 1;
    }
    var name = clean.substring(first, last);
    var kind = clean.substring(hit + tail.length, last).toLowerCase();
    if (kind !== "jpg" && kind !== "jpeg" && kind !== "png" && kind !== "webp") {
      continue;
    }
    if (name.length < 20) {
      continue;
    }
    if (bad[name] || good.indexOf(name) !== -1 || extra.indexOf(name) !== -1) {
      continue;
    }
    extra.push(name);
  }

  return good.concat(extra);
}

function mix(begin) {
  for (var index = pool.length - 1; index > begin; index--) {
    var other = begin + Math.floor(Math.random() * (index - begin + 1));
    var hold = pool[index];
    pool[index] = pool[other];
    pool[other] = hold;
  }
}

function ambient(id) {
  var next = 1 - lit;
  pick("glow" + next).style.backgroundImage = 'url("' + small(id) + '")';
  pick("glow" + next).className = "glow on";
  pick("glow" + lit).className = "glow";
  lit = next;
}

function message(text, label, action) {
  stack.innerHTML = "";
  var box = document.createElement("div");
  box.className = "message";
  var line = document.createElement("p");
  line.textContent = text;
  box.appendChild(line);
  if (label) {
    var button = document.createElement("button");
    button.textContent = label;
    button.addEventListener("click", action);
    box.appendChild(button);
  }
  stack.appendChild(box);
}

function build(id, depth) {
  var card = document.createElement("div");
  card.className = "card";
  card.setAttribute("data-id", id);

  var image = document.createElement("img");
  image.src = preview(id);
  image.alt = "";
  card.appendChild(image);

  if (depth === 0) {
    var liked = document.createElement("div");
    liked.className = "stamp keep";
    liked.id = "liked";
    liked.textContent = "keep";
    card.appendChild(liked);

    var passed = document.createElement("div");
    passed.className = "stamp skip";
    passed.id = "passed";
    passed.textContent = "skip";
    card.appendChild(passed);

    card.addEventListener("pointerdown", press);
    card.addEventListener("pointermove", move);
    card.addEventListener("pointerup", release);
    card.addEventListener("pointercancel", release);
  } else {
    card.style.transform = "scale(" + (1 - depth * 0.06) + ")";
  }
  return card;
}

function preload() {
  for (var step = 3; step < 6; step++) {
    if (place + step < pool.length) {
      var probe = new Image();
      probe.src = preview(pool[place + step]);
    }
  }
}

function draw() {
  var total = pool.length - place;
  if (total <= 0) {
    if (loading) {
      message("Finding wallpapers");
    } else if (problems > 0 && pool.length === 0) {
      message("Could not reach the site. Check your connection.", "Try again", retry);
    } else {
      message("You have seen everything here.", "Start over", restart);
    }
    return;
  }
  stack.innerHTML = "";
  var count = Math.min(3, total);
  for (var depth = count - 1; depth >= 0; depth--) {
    stack.appendChild(build(pool[place + depth], depth));
  }
  ambient(pool[place]);
  preload();
}

function visible() {
  return stack.querySelectorAll(".card").length;
}

function stamps() {
  var liked = pick("liked");
  var passed = pick("passed");
  if (!liked || !passed) {
    return;
  }
  var amount = Math.min(Math.abs(shift.x) / 120, 1);
  liked.style.opacity = shift.x > 0 ? amount : 0;
  passed.style.opacity = shift.x < 0 ? amount : 0;
}

function below(scale, smooth) {
  var count = stack.children.length;
  if (count < 2) {
    return;
  }
  var card = stack.children[count - 2];
  card.style.transition = smooth ? "transform 0.25s" : "none";
  card.style.transform = "scale(" + scale + ")";
}

function press(event) {
  if (flying) {
    return;
  }
  dragging = true;
  anchor.x = event.clientX;
  anchor.y = event.clientY;
  shift.x = 0;
  shift.y = 0;
  var card = event.currentTarget;
  card.setPointerCapture(event.pointerId);
  card.style.transition = "none";
}

function move(event) {
  if (!dragging) {
    return;
  }
  shift.x = event.clientX - anchor.x;
  shift.y = event.clientY - anchor.y;
  var card = event.currentTarget;
  var turn = shift.x / 18;
  card.style.transform = "translate(" + shift.x + "px," + shift.y + "px) rotate(" + turn + "deg)";
  stamps();
  var progress = Math.min(Math.abs(shift.x) / 160, 1);
  below(0.94 + 0.06 * progress, false);
}

function release(event) {
  if (!dragging) {
    return;
  }
  dragging = false;
  var card = event.currentTarget;
  if (shift.x > 110) {
    fly(1);
  } else if (shift.x < -110) {
    fly(-1);
  } else {
    card.style.transition = "transform 0.25s";
    card.style.transform = "";
    shift.x = 0;
    shift.y = 0;
    stamps();
    below(0.94, true);
  }
}

function fly(way) {
  if (flying || place >= pool.length) {
    return;
  }
  var card = stack.lastChild;
  if (!card || card.className !== "card") {
    return;
  }
  flying = true;
  side = way;
  flight = session;
  var far = window.innerWidth * 1.3 * way;
  card.style.transition = "transform 0.3s ease-in";
  card.style.transform = "translate(" + far + "px," + shift.y + "px) rotate(" + way * 25 + "deg)";
  below(1, true);
  setTimeout(landed, 300);
}

function landed() {
  if (flight !== session) {
    return;
  }
  flying = false;
  var id = pool[place];
  if (side > 0) {
    bookmark(id);
  }
  seen[id] = 1;
  store("seen", seen);
  place = place + 1;
  shift.x = 0;
  shift.y = 0;
  draw();
}

function bookmark(id) {
  if (saved.indexOf(id) === -1) {
    saved.unshift(id);
    store("saved", saved);
    count();
    notice("Saved");
  }
}

function skip() {
  shift.x = 0;
  shift.y = 0;
  var passed = pick("passed");
  if (passed) {
    passed.style.opacity = 1;
  }
  fly(-1);
}

function keep() {
  shift.x = 0;
  shift.y = 0;
  var liked = pick("liked");
  if (liked) {
    liked.style.opacity = 1;
  }
  fly(1);
}

function count() {
  pick("count").textContent = saved.length;
}

function show(name, on) {
  if (name === "sheet") {
    pick("sheet").className = on ? "open" : "";
    pick("cover").className = on ? "open" : "";
  }
  if (name === "panel") {
    pick("panel").className = on ? "overlay open" : "overlay";
  }
  if (name === "detail") {
    pick("detail").className = on ? "overlay open" : "overlay";
  }
}

function push(name) {
  layers.push(name);
  try {
    history.pushState(name, "");
  } catch (problem) {
    pushed = false;
  }
  show(name, true);
}

function popped() {
  if (layers.length === 0) {
    return;
  }
  var name = layers.pop();
  show(name, false);
}

function dismiss() {
  if (layers.length === 0) {
    return;
  }
  if (pushed) {
    history.back();
  } else {
    popped();
  }
}

function ask() {
  if (place >= pool.length) {
    return;
  }
  target = pool[place];
  push("sheet");
}

function choose(event) {
  var mode = parseInt(event.currentTarget.getAttribute("data-mode"), 10);
  dismiss();
  commit(mode);
}

function commit(mode) {
  if (!window.Native) {
    window.open(original(target), "_blank");
    notice("Opened in a new tab");
    return;
  }
  Native.paint(original(target), mode);
  notice("Setting wallpaper", true);
  clearInterval(timer);
  timer = setInterval(poll, 500);
}

function poll() {
  var now = Native.state();
  if (now === "working") {
    return;
  }
  clearInterval(timer);
  if (now === "done") {
    notice("Wallpaper set");
  } else {
    notice("Could not set it. Try again");
  }
}

function fill() {
  var grid = pick("grid");
  grid.innerHTML = "";
  if (saved.length === 0) {
    var note = document.createElement("div");
    note.id = "empty";
    note.textContent = "Nothing saved yet. Swipe right on a wallpaper to keep it.";
    grid.appendChild(note);
    return;
  }
  for (var index = 0; index < saved.length; index++) {
    var tile = document.createElement("img");
    tile.className = "tile";
    tile.src = small(saved[index]);
    tile.alt = "";
    tile.setAttribute("data-id", saved[index]);
    tile.addEventListener("click", inspect);
    grid.appendChild(tile);
  }
}

function browse() {
  fill();
  push("panel");
}

function inspect(event) {
  target = event.currentTarget.getAttribute("data-id");
  pick("photo").src = preview(target);
  push("detail");
}

function assign() {
  push("sheet");
}

function discard() {
  var index = saved.indexOf(target);
  if (index !== -1) {
    saved.splice(index, 1);
    store("saved", saved);
  }
  count();
  fill();
  dismiss();
  notice("Removed");
}

function chips() {
  var row = pick("chips");
  row.innerHTML = "";
  var names = [{ slug: "all", name: "Everything" }].concat(cats);
  for (var index = 0; index < names.length; index++) {
    var button = document.createElement("button");
    button.className = names[index].slug === active ? "chip on" : "chip";
    button.textContent = names[index].name;
    button.setAttribute("data-slug", names[index].slug);
    button.addEventListener("click", filter);
    row.appendChild(button);
  }
}

function filter(event) {
  var slug = event.currentTarget.getAttribute("data-slug");
  if (slug === active) {
    return;
  }
  active = slug;
  chips();
  start(slug);
}

function start(slug) {
  session = session + 1;
  pool = [];
  place = 0;
  queue = [];
  problems = 0;
  dragging = false;
  flying = false;
  if (slug === "all") {
    for (var index = 0; index < cats.length; index++) {
      queue.push(cats[index].slug);
    }
  } else {
    queue.push(slug);
  }
  loading = true;
  draw();
  advance();
}

function advance() {
  if (queue.length === 0) {
    loading = false;
    if (place >= pool.length) {
      draw();
    }
    return;
  }
  var slug = queue.shift();
  var address = slug === "home" ? base : base + slug;
  download(address, session);
}

function download(address, token) {
  var request = new XMLHttpRequest();
  request.open("GET", address);
  request.timeout = 20000;
  request.onload = loaded;
  request.onerror = failed;
  request.ontimeout = failed;
  request.token = token;
  request.address = address;
  request.send();
}

function loaded() {
  if (this.token !== session) {
    return;
  }
  if (this.status !== 200) {
    fallback(this.address);
    return;
  }
  accept(this.responseText);
}

function failed() {
  if (this.token !== session) {
    return;
  }
  fallback(this.address);
}

function fallback(address) {
  var html = "";
  try {
    if (window.Native) {
      html = Native.page(address);
    }
  } catch (problem) {
    html = "";
  }
  if (html) {
    accept(html);
    return;
  }
  problems = problems + 1;
  advance();
}

function accept(html) {
  var ids = harvest(html);
  var added = 0;
  for (var index = 0; index < ids.length; index++) {
    if (seen[ids[index]]) {
      continue;
    }
    if (pool.indexOf(ids[index]) !== -1) {
      continue;
    }
    pool.push(ids[index]);
    added = added + 1;
  }
  mix(place + 3);
  if (added > 0 && !dragging && !flying) {
    if (visible() < 3 && place + visible() < pool.length) {
      draw();
    }
  }
  advance();
}

function retry() {
  start(active);
}

function restart() {
  seen = {};
  store("seen", seen);
  start(active);
}

function block(event) {
  event.preventDefault();
}

function boot() {
  var one = load("saved");
  if (one && one.length !== undefined) {
    saved = one;
  }
  var two = load("seen");
  if (two) {
    seen = two;
  }
  count();
  chips();

  pick("nope").addEventListener("click", skip);
  pick("like").addEventListener("click", keep);
  pick("wallpaper").addEventListener("click", ask);
  pick("saves").addEventListener("click", browse);
  pick("finish").addEventListener("click", dismiss);
  pick("back").addEventListener("click", dismiss);
  pick("assign").addEventListener("click", assign);
  pick("trash").addEventListener("click", discard);
  pick("cover").addEventListener("click", dismiss);
  pick("cancel").addEventListener("click", dismiss);

  var options = document.querySelectorAll(".option");
  for (var index = 0; index < options.length; index++) {
    if (options[index].getAttribute("data-mode")) {
      options[index].addEventListener("click", choose);
    }
  }

  window.addEventListener("popstate", popped);
  document.addEventListener("contextmenu", block);

  start("all");
}

boot();
</script>
</body>
</html>
